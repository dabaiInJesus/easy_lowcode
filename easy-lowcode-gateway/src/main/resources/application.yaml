server:
  port: 8080
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json
    min-response-size: 1024

spring:
  application:
    name: easy-lowcode-gateway

  # Redis 配置（用于限流和缓存）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms

  # Gateway 路由配置
  cloud:
    gateway:
      # 默认过滤器
      default-filters:
        - DedupeResponseHeader=Vary Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 100
            redis-rate-limiter.burstCapacity: 200
            redis-rate-limiter.requestedTokens: 1

      routes:
        # ==================== 微服务路由配置 ====================
        # 注意：当前项目以单体模式运行，以下路由配置为未来微服务拆分预留
        
        # 认证服务
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 200
                redis-rate-limiter.burstCapacity: 400
            - StripPrefix=0
        
        # 数据库服务
        - id: database-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/database/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
            - StripPrefix=0
        
        # AI服务
        - id: ai-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/ai/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 50
            - StripPrefix=0
        
        # 数据可视化服务
        - id: dashboard-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/dashboard/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
            - StripPrefix=0
        
        # 资源服务
        - id: resource-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/resource/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
            - StripPrefix=0
        
        # 默认路由（单体模式）
        - id: monolith
          uri: http://localhost:8081
          predicates:
            - Path=/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200

      # 全局 CORS 配置
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${CORS_ORIGINS:**}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - X-Request-Id
              - X-Total-Count
              - Content-Disposition
            allowCredentials: true
            maxAge: 3600

# JWT 配置
jwt:
  secret: ${JWT_SECRET:}

# Sa-Token 配置
sa-token:
  token-name: satoken
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# Gateway 认证白名单
gateway:
  auth:
    whitelist:
      # 认证相关
      - /api/auth/login
      - /api/auth/register
      - /api/auth/captcha
      - /api/auth/health/**
      # Swagger文档
      - /swagger-ui/**
      - /v3/api-docs/**
      - /swagger-resources/**
      # Actuator监控
      - /actuator/**

# Resilience4j 熔断配置
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10

# 日志配置
logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.circuitbreaker: DEBUG
    com.dabai.easy_lowcode: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
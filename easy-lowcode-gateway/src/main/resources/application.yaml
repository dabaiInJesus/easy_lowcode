server:
  port: 8080

spring:
  application:
    name: easy-lowcode-gateway
  
  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      database: 0
  
  # Gateway 路由配置
  cloud:
    gateway:
      routes:
        # 认证服务
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        
        # AI 服务
        - id: ai-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/ai/**
        
        # 资源查询服务
        - id: resource-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/resource/**
      
      # 全局 CORS 配置
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

# Sa-Token 配置
sa-token:
  token-name: satoken
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# 日志配置
logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.dabai.easy_lowcode: DEBUG

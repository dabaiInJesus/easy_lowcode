server:
  port: 8080

spring:
  application:
    name: easy-lowcode-gateway

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

  # Gateway 路由配置
  cloud:
    gateway:
      routes:
        # 所有请求路由到单体应用（startup 模块，端口 8081）
        # 注意：当前项目以单体模式运行，startup 是唯一入口
        - id: monolith
          uri: http://localhost:8081
          predicates:
            - Path=/**

      # 全局 CORS 配置（修复 allowCredentials + wildcard 冲突）
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${CORS_ORIGINS:**}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

# Sa-Token 配置
sa-token:
  token-name: satoken
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# 日志配置
logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.dabai.easy_lowcode: DEBUG

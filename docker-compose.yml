version: '3.8'

services:
  # PostgreSQL 17 with pgvector
  postgres:
    image: pgvector/pgvector:pg17
    container_name: easy-lowcode-pg17
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: thinker
      POSTGRES_DB: easy_lowcode
      TZ: Asia/Shanghai
    volumes:
      - pg17_data:/var/lib/postgresql/data
    networks:
      - easy-lowcode-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:8.6.2
    container_name: easy-lowcode-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - easy-lowcode-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RocketMQ NameServer
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.0
    container_name: easy-lowcode-rocketmq-namesrv
    restart: always
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    networks:
      - easy-lowcode-network
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    healthcheck:
      test: ["CMD", "sh", "mqadmin", "clusterList"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # RocketMQ Broker
  rocketmq-broker:
    image: apache/rocketmq:5.3.0
    container_name: easy-lowcode-rocketmq-broker
    restart: always
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    command: sh mqbroker -n namesrv:9876
    depends_on:
      - rocketmq-namesrv
    networks:
      - easy-lowcode-network
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
      NAMESRV_ADDR: "namesrv:9876"
    volumes:
      - rocketmq_broker_logs:/home/rocketmq/logs
      - rocketmq_broker_store:/home/rocketmq/store

  # RocketMQ Console (可选，用于可视化管理)
  rocketmq-console:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: easy-lowcode-rocketmq-console
    restart: always
    ports:
      - "8088:8080"
    depends_on:
      - rocketmq-namesrv
    networks:
      - easy-lowcode-network
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=namesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false"

volumes:
  pg17_data:
    driver: local
  redis_data:
    driver: local
  rocketmq_broker_logs:
    driver: local
  rocketmq_broker_store:
    driver: local

networks:
  easy-lowcode-network:
    driver: bridge

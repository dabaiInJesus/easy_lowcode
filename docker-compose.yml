version: '3.8'

# =============================================
# Easy Lowcode - Docker Compose 配置
# 使用方式:
#   1. 基础启动（PostgreSQL + Redis + RocketMQ）:
#      docker-compose up -d postgres redis rocketmq-namesrv rocketmq-broker
#
#   2. 完整启动（含应用）:
#      docker-compose up -d
#
#   3. 指定环境变量文件:
#      cp .env.example .env
#      # 编辑 .env 填入真实密码和 API Key
#      docker-compose up -d
# =============================================

services:
  # PostgreSQL 17 with pgvector
  postgres:
    image: pgvector/pgvector:pg17
    container_name: easy-lowcode-pg17
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   # 必须通过环境变量配置，禁止硬编码
      POSTGRES_DB: ${POSTGRES_DB:-easy_lowcode}
      TZ: Asia/Shanghai
    volumes:
      - pg17_data:/var/lib/postgresql/data
    networks:
      - easy-lowcode-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:8.6.2
    container_name: easy-lowcode-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - easy-lowcode-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RocketMQ NameServer
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.0
    container_name: easy-lowcode-rocketmq-namesrv
    restart: always
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    networks:
      - easy-lowcode-network
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 9876"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # RocketMQ Broker
  rocketmq-broker:
    image: apache/rocketmq:5.3.0
    container_name: easy-lowcode-rocketmq-broker
    restart: always
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    command: sh mqbroker -n namesrv:9876
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    networks:
      - easy-lowcode-network
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
      NAMESRV_ADDR: "namesrv:9876"
    volumes:
      - rocketmq_broker_logs:/home/rocketmq/logs
      - rocketmq_broker_store:/home/rocketmq/store

  # RocketMQ Console (可选，用于可视化管理)
  rocketmq-console:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: easy-lowcode-rocketmq-console
    restart: always
    ports:
      - "8088:8080"
    depends_on:
      - rocketmq-namesrv
    networks:
      - easy-lowcode-network
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=namesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false"

  # Easy Lowcode 应用（单体模式）
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: easy-lowcode-app
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 数据库（Docker Compose 内部网络）
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # RocketMQ
      ROCKETMQ_NAMESERVER: rocketmq-namesrv:9876
      # AI API Keys（必须配置）
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      # AI 默认供应商
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-**}
    networks:
      - easy-lowcode-network

volumes:
  pg17_data:
    driver: local
  redis_data:
    driver: local
  rocketmq_broker_logs:
    driver: local
  rocketmq_broker_store:
    driver: local

networks:
  easy-lowcode-network:
    driver: bridge

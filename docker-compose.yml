version: '3.8'

# =============================================
# Easy Lowcode - Docker Compose 配置
# 使用方式:
#   1. 基础启动（PostgreSQL + Redis + RocketMQ）:
#      docker-compose up -d postgres redis rocketmq-namesrv rocketmq-broker
#
#   2. 完整启动（含应用）:
#      docker-compose up -d
#
#   3. 指定环境变量文件:
#      cp .env.example .env
#      # 编辑 .env 填入真实密码和 API Key
#      docker-compose up -d
# =============================================

services:
  # PostgreSQL 17 with pgvector
  postgres:
    image: pgvector/pgvector:pg17
    container_name: easy-lowcode-pg17
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   # 必须通过环境变量配置，禁止硬编码
      POSTGRES_DB: ${POSTGRES_DB:-easy_lowcode}
      TZ: Asia/Shanghai
    volumes:
      - pg17_data:/var/lib/postgresql/data
    networks:
      - easy-lowcode-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:8.6.2
    container_name: easy-lowcode-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - easy-lowcode-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RocketMQ NameServer
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.0
    container_name: easy-lowcode-rocketmq-namesrv
    restart: always
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    networks:
      - easy-lowcode-network
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 9876"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # RocketMQ Broker
  rocketmq-broker:
    image: apache/rocketmq:5.3.0
    container_name: easy-lowcode-rocketmq-broker
    restart: always
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    command: sh mqbroker -n namesrv:9876
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    networks:
      - easy-lowcode-network
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
      NAMESRV_ADDR: "namesrv:9876"
    volumes:
      - rocketmq_broker_logs:/home/rocketmq/logs
      - rocketmq_broker_store:/home/rocketmq/store

  # RocketMQ Console (可选，用于可视化管理)
  rocketmq-console:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: easy-lowcode-rocketmq-console
    restart: always
    ports:
      - "8088:8080"
    depends_on:
      - rocketmq-namesrv
    networks:
      - easy-lowcode-network
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=namesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false"

  # ============================================
  # 监控和日志体系
  # ============================================

  # Prometheus - 指标监控
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: easy-lowcode-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - easy-lowcode-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana - 可视化仪表板
  grafana:
    image: grafana/grafana:11.0.0
    container_name: easy-lowcode-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./config/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./config/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - easy-lowcode-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Alertmanager - 告警管理
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: easy-lowcode-alertmanager
    restart: always
    ports:
      - "9093:9093"
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - easy-lowcode-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch - 日志存储和搜索
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    container_name: easy-lowcode-elasticsearch
    restart: always
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - TZ=Asia/Shanghai
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - easy-lowcode-network
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:9200/_cluster/health", "!=", "\"status\":\"red\""]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kibana - Elasticsearch 可视化
  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.0
    container_name: easy-lowcode-kibana
    restart: always
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      TZ: Asia/Shanghai
    networks:
      - easy-lowcode-network
    depends_on:
      - elasticsearch
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:5601/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Jaeger - 分布式追踪
  jaeger:
    image: jaegertracing/all-in-one:1.52.0
    container_name: easy-lowcode-jaeger
    restart: always
    ports:
      - "6831:6831/udp"  # Jaeger agent (compact thrift)
      - "6832:6832/udp"  # Jaeger agent (binary thrift)
      - "5778:5778"      # Jaeger agent (serve configs)
      - "16686:16686"    # Jaeger UI
      - "14268:14268"    # Jaeger collector (HTTP)
      - "14250:14250"    # Jaeger collector (gRPC)
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
      TZ: Asia/Shanghai
    networks:
      - easy-lowcode-network
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:16686/api/traces"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================
  # 业务应用
  # ============================================

  # Easy Lowcode 应用（单体模式）
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: easy-lowcode-app
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    environment:
      # 数据库（Docker Compose 内部网络）
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # RocketMQ
      ROCKETMQ_NAMESERVER: rocketmq-namesrv:9876
      # AI API Keys（必须配置）
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      # AI 默认供应商
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-**}
      # 监控配置
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      # 日志导出到Elasticsearch
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_PATTERN_CONSOLE: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    networks:
      - easy-lowcode-network

volumes:
  pg17_data:
    driver: local
  redis_data:
    driver: local
  rocketmq_broker_logs:
    driver: local
  rocketmq_broker_store:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
  elasticsearch_data:
    driver: local

networks:
  easy-lowcode-network:
    driver: bridge

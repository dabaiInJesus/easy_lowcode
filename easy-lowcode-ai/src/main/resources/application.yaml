# Easy Lowcode AI 模块配置
#
# 重要：API Key 必须通过环境变量配置，不要直接写在配置文件中
# 必需的环境变量：
#   - DASHSCOPE_API_KEY    （通义千问）
#   - OPENAI_API_KEY       （OpenAI GPT）
#   - DEEPSEEK_API_KEY     （DeepSeek）
#   - MINIMAX_API_KEY      （Minimax）
#   - OLLAMA_BASE_URL      （Ollama 本地，可选，默认 http://localhost:11434）

server:
  port: 8081

spring:
  application:
    name: easy-lowcode-ai

  # Spring AI OpenAI 配置（如果使用 OpenAI）
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: https://api.openai.com/v1
      chat:
        options:
          model: gpt-3.5-turbo

# AI 配置
ai:
  # 默认 AI 提供商 (openai/dashscope/ollama/deepseek/minimax)
  provider:
    default: dashscope

  # OpenAI 配置（必需：设置 OPENAI_API_KEY 环境变量）
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-3.5-turbo}

  # 通义千问配置（必需：设置 DASHSCOPE_API_KEY 环境变量）
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
    model: ${DASHSCOPE_MODEL:qwen-turbo}

  # Ollama 配置（可选：本地运行）
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama2}

  # DeepSeek 配置（必需：设置 DEEPSEEK_API_KEY 环境变量）
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
    model: ${DEEPSEEK_MODEL:deepseek-chat}

  # Minimax 配置（必需：设置 MINIMAX_API_KEY 环境变量）
  minimax:
    api-key: ${MINIMAX_API_KEY:}
    base-url: ${MINIMAX_BASE_URL:https://api.minimax.chat/v1}
    model: ${MINIMAX_MODEL:abab6-chat}

# 日志配置
logging:
  level:
    root: INFO
    com.dabai.easy_lowcode.ai: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Actuator 健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

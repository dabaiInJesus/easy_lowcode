# Easy Lowcode AI 模块配置

server:
  port: 8081

spring:
  application:
    name: easy-lowcode-ai
  
  # Spring AI OpenAI 配置（如果使用 OpenAI）
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-placeholder-for-development}
      base-url: https://api.openai.com/v1
      chat:
        options:
          model: gpt-3.5-turbo

# AI 配置
ai:
  # 默认 AI 提供商 (openai/dashscope/ollama/deepseek/minimax)
  provider:
    default: dashscope
  
  # OpenAI 配置
  openai:
    api-key: ${OPENAI_API_KEY:sk-placeholder-for-development}
    base-url: https://api.openai.com/v1
    model: gpt-3.5-turbo
  
  # 通义千问配置（阿里云 DashScope）
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:your-dashscope-api-key}
    model: qwen-turbo
  
  # Ollama 配置（本地运行）
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama2}
  
  # DeepSeek 配置
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
  
  # Minimax 配置
  minimax:
    api-key: ${MINIMAX_API_KEY:your-minimax-api-key}
    base-url: ${MINIMAX_BASE_URL:https://api.minimax.chat/v1}
    model: ${MINIMAX_MODEL:abab6-chat}

# 日志配置
logging:
  level:
    root: INFO
    com.dabai.easy_lowcode.ai: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'

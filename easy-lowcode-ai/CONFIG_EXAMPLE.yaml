# Spring AI Alibaba 配置示例
# 
# 本文件展示了如何配置 easy-lowcode-ai 模块以支持 Spring AI Alibaba 1.1.2.0
# 以及多种 AI 模型提供商：Ollama、DeepSeek、Minimax 等

# ========================
# AI 提供商选择
# ========================
# 可用的提供商选项:
# - openai: OpenAI (GPT-3.5, GPT-4)
# - dashscope: 阿里云通义千问
# - wenxin: 百度文心一言
# - hunyuan: 腾讯混元
# - zhipu: 智谱清言
# - moonshot: Moonshot (Kimi)
# - ollama: Ollama (本地模型)
# - deepseek: DeepSeek
# - minimax: Minimax

ai:
  provider:
    default: ollama  # 更改此值以切换默认 AI 提供商

  # ========================
  # Ollama 配置（本地运行）
  # ========================
  # Ollama 是一个开源工具，允许您在本地运行大型语言模型
  # 安装指南: https://ollama.ai/
  ollama:
    base-url: http://localhost:11434
    model: llama2  # 可选: llama2, mistral, codellama, qwen 等

  # ========================
  # DeepSeek 配置
  # ========================
  # DeepSeek 是一家专注于代码生成的 AI 公司
  # 获取 API Key: https://platform.deepseek.com/
  deepseek:
    api-key: your-deepseek-api-key-here
    base-url: https://api.deepseek.com/v1
    model: deepseek-chat  # 或 deepseek-coder

  # ========================
  # Minimax 配置
  # ========================
  # Minimax 提供多种对话和文本生成模型
  # 获取 API Key: https://api.minimax.chat/
  minimax:
    api-key: your-minimax-api-key-here
    base-url: https://api.minimax.chat/v1
    model: abab6-chat

  # ========================
  # 通义千问配置（阿里云）
  # ========================
  dashscope:
    api-key: your-dashscope-api-key-here
    model: qwen-turbo  # 或 qwen-plus, qwen-max

  # ========================
  # OpenAI 配置
  # ========================
  openai:
    api-key: your-openai-api-key-here
    base-url: https://api.openai.com/v1
    model: gpt-3.5-turbo  # 或 gpt-4, gpt-4-turbo

# ========================
# Spring AI Alibaba Agent 配置
# ========================
# Spring AI Alibaba 提供了强大的 Agent 功能
# 可以通过以下配置启用和自定义 Agent 行为

spring:
  ai:
    alibaba:
      agent:
        enabled: true
        # Agent 执行超时时间（秒）
        timeout: 300
        # 最大迭代次数
        max-iterations: 10
        # 是否启用记忆功能
        memory-enabled: true

# ========================
# 使用示例
# ========================
#
# 1. 使用 Ollama（本地模型）:
#    - 安装 Ollama: https://ollama.ai/
#    - 拉取模型: ollama pull llama2
#    - 设置 ai.provider.default=ollama
#    - 启动应用并访问: http://localhost:8080/api/ai/chat
#
# 2. 使用 DeepSeek:
#    - 注册并获取 API Key
#    - 设置 ai.provider.default=deepseek
#    - 配置 ai.deepseek.api-key
#    - 启动应用
#
# 3. 使用 Minimax:
#    - 注册并获取 API Key
#    - 设置 ai.provider.default=minimax
#    - 配置 ai.minimax.api-key
#    - 启动应用
#
# 4. 使用 Agent 功能:
#    - 确保 spring.ai.alibaba.agent.enabled=true
#    - 访问 Agent API: http://localhost:8080/api/ai/agent/list
#    - 执行 Agent 任务: POST http://localhost:8080/api/ai/agent/execute
#      {
#        "agentName": "SampleAgent",
#        "task": "请帮我分析这段代码"
#      }

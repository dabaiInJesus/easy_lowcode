server:
  port: 8081
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: easy-lowcode
  main:
    allow-bean-definition-overriding: true
  mvc:
    servlet:
      encoding:
        charset: UTF-8
        enabled: true
        force: true
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  
  # Spring AI 配置
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: https://api.openai.com/v1
      chat:
        options:
          model: gpt-3.5-turbo
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
  
  # 数据源配置
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/easy_lowcode?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres123}
  
  # Liquibase 数据库版本管理配置
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    contexts: dev
    database-change-log-table: databasechangelog
    database-change-log-lock-table: databasechangeloglock
  
  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: 200
          max-wait: -1ms
          max-idle: 10
          min-idle: 0

  # RocketMQ配置
  rocketmq:
    name-server: ${ROCKETMQ_NAMESERVER:localhost:9876}
    producer:
      group: easy-lowcode-producer
      send-message-timeout: 3000
  
  # Flowable配置（已禁用：当前未使用工作流引擎）
  # flowable:
  #   async-executor-activate: true
  #   database-schema-update: true
  #   check-process-definitions: false
  
# DevTools 热重载配置
    devtools:
      restart:
        enabled: true
        additional-paths: src/main/java
      livereload:
        enabled: true
  # 自由标记模板缓存（开发时关闭）
  freemarker:
    cache: false
  # Thymeleaf 模板缓存（开发时关闭）
  thymeleaf:
    cache: false

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# 加密配置
encrypt:
  aes:
    key: ${ENCRYPT_AES_KEY:1234567890123456}

# JWT 配置
jwt:
  secret: ${JWT_SECRET:easy-lowcode-jwt-secret-key-2024-very-long-string}
  expiration: 2592000000

# JWT 配置（由 jjwt 库处理，上述 jwt.secret 已配置）
# 无额外 Sa-Token 配置

# AI 配置（所有 key 必须通过环境变量配置，禁止硬编码）
ai:
  # 默认 AI 提供商 (openai/dashscope/wenxin/hunyuan/zhipu/moonshot/ollama/deepseek/minimax)
  provider:
    default: ${AI_DEFAULT_PROVIDER:}

  # OpenAI 配置
  openai:
    enabled: true
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-3.5-turbo}

  # 通义千问配置
  dashscope:
    enabled: true
    api-key: ${DASHSCOPE_API_KEY:}
    model: ${DASHSCOPE_MODEL:qwen-turbo}

  # 文心一言配置
  wenxin:
    enabled: true
    api-key: ${WENXIN_API_KEY:}
    secret-key: ${WENXIN_SECRET_KEY:}
    model: ${WENXIN_MODEL:eb-instant}

  # Ollama 配置
  ollama:
    enabled: true
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama2}

  # DeepSeek 配置
  deepseek:
    enabled: true
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
    model: ${DEEPSEEK_MODEL:deepseek-chat}

  # Minimax 配置
  minimax:
    enabled: true
    api-key: ${MINIMAX_API_KEY:}
    base-url: ${MINIMAX_BASE_URL:https://api.minimax.chat/v1}
    model: ${MINIMAX_MODEL:abab6-chat}

# 日志配置
logging:
  level:
    root: INFO
    com.dabai.easy_lowcode: DEBUG
    liquibase: INFO
    liquibase.command: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
  file:
    name: logs/easy-lowcode.log

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,logfile
        base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    metrics:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true
  health:
    elasticsearch:
      enabled: false
    rabbit:
      enabled: false
    redis:
      enabled: true
    db:
      enabled: true
  info:
    env:
      enabled: true

# 全文检索配置
easy-lowcode:
  search:
    engine: meilisearch  # meilisearch | elasticsearch
    meilisearch:
      host: http://localhost:7700
      api-key: ${MEILISEARCH_API_KEY:}
      index-name: fulltext_docs
    elasticsearch:
      host: localhost:9200
      username: ${ES_USERNAME:}
      password: ${ES_PASSWORD:}
  storage:
    type: minio  # minio | s3 | local
    minio:
      endpoint: http://localhost:9000
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: easy-lowcode-files
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: us-east-1
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}
      bucket: easy-lowcode-files
    local:
      path: ${LOCAL_STORAGE_PATH:./data/files}

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

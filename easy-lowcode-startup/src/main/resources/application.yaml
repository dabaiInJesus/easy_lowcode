server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: easy-lowcode
  
  # Spring AI 配置
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-placeholder-for-development}
      base-url: https://api.openai.com/v1
      chat:
        options:
          model: gpt-3.5-turbo
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:sk-placeholder-for-development}
  
  # 数据源配置
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/easy_lowcode?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: postgres
    password: ${DB_PASSWORD:thinker}
  
  # Liquibase 数据库版本管理配置
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    contexts: dev
    database-change-log-table: databasechangelog
    database-change-log-lock-table: databasechangeloglock
  
  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: 200
          max-wait: -1ms
          max-idle: 10
          min-idle: 0
  
  # RocketMQ配置
  rocketmq:
    name-server: localhost:9876
    producer:
      group: easy-lowcode-producer
      send-message-timeout: 3000
  
  # Flowable配置
  flowable:
    async-executor-activate: true
    database-schema-update: true
    check-process-definitions: false
  
  # DevTools 热重载配置
  devtools:
    restart:
      enabled: true  # 启用热重载
      additional-paths: src/main/java  # 监控的额外路径
      exclude: static/**,public/**,templates/**  # 排除不需要重启的资源
    livereload:
      enabled: true  # 启用 LiveReload
  # 自由标记模板缓存（开发时关闭）
  freemarker:
    cache: false
  # Thymeleaf 模板缓存（开发时关闭）
  thymeleaf:
    cache: false

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# Sa-Token配置
sa-token:
  token-name: satoken
  timeout: 2592000
  activity-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  is-read-cookie: false
  is-read-header: true

# AI 配置
ai:
  # 默认 AI 提供商 (openai/dashscope/wenxin/hunyuan/zhipu/moonshot/ollama/deepseek/minimax)
  provider:
    default: openai
  
  # OpenAI 配置
  openai:
    api-key: ${OPENAI_API_KEY:sk-placeholder-for-development}
    base-url: https://api.openai.com/v1
    model: gpt-3.5-turbo
  
  # 通义千问配置
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:your-dashscope-api-key}
    model: qwen-turbo
  
  # 文心一言配置
  wenxin:
    api-key: ${WENXIN_API_KEY:your-wenxin-api-key}
    secret-key: ${WENXIN_SECRET_KEY:your-wenxin-secret-key}
    model: eb-instant
  
  # Ollama 配置
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama2}
  
  # DeepSeek 配置
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
  
  # Minimax 配置
  minimax:
    api-key: ${MINIMAX_API_KEY:your-minimax-api-key}
    base-url: ${MINIMAX_BASE_URL:https://api.minimax.chat/v1}
    model: ${MINIMAX_MODEL:abab6-chat}

# 日志配置
logging:
  level:
    root: INFO
    com.dabai.easy_lowcode: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

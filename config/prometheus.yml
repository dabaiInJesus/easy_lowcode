# Prometheus 配置文件
# 用于监控 Easy Lowcode 平台的性能和可靠性指标

global:
  scrape_interval: 15s       # 抓取间隔
  evaluation_interval: 15s   # 规则评估间隔
  external_labels:
    monitor: 'easy-lowcode'
    environment: 'production'

# 告警管理器配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# 告警规则文件
rule_files:
  - '/etc/prometheus/alert-rules.yml'

# 抓取配置
scrape_configs:
  # Prometheus 自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Easy Lowcode 应用 - Spring Boot Actuator
  - job_name: 'easy-lowcode-app'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ['app:8081']
        labels:
          service: 'easy-lowcode-startup'
          instance: 'easy-lowcode-app-1'
    relabel_configs:
      # 添加自定义标签
      - source_labels: [__address__]
        target_label: instance
        replacement: 'app:8081'

  # PostgreSQL 指标 (如果启用了pg_exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'postgres-1'

  # Redis 指标 (如果启用了redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'redis-1'

  # RocketMQ 指标
  - job_name: 'rocketmq'
    static_configs:
      - targets: ['rocketmq-exporter:5557']
    scrape_interval: 30s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'rocketmq-broker'

  # Elasticsearch 指标
  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch-exporter:9114']
    scrape_interval: 30s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'elasticsearch-1'

  # Docker 容器指标
  - job_name: 'docker'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'docker-host'

# ===================================
# 指标标签重映射规则
# ===================================
# 用于统一和规范化指标标签，便于后续查询和告警

metric_relabel_configs:
  # 过滤不需要的指标，减少存储空间占用
  - source_labels: [__name__]
    regex: 'go_gc_.*|go_memstats_.*|process_resident_memory_bytes'
    action: drop
  
  # 保留重要的应用指标
  - source_labels: [__name__]
    regex: '.*_(total|count|seconds_.*|gauge|histogram|summary).*'
    action: keep

# ===================================
# 注意
# ===================================
# 1. 如需监控PostgreSQL、Redis等，需在docker-compose.yml中添加相应exporter容器
# 2. 生产环境建议启用认证和HTTPS
# 3. 数据保留期建议根据磁盘容量调整 (命令行参数: --storage.tsdb.retention.time)
# 4. 告警规则文件支持自动重载
# 5. 详细配置参考: https://prometheus.io/docs/prometheus/latest/configuration/configuration/

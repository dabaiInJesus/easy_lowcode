apiVersion: 1

datasources:
  # Prometheus 数据源
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
    orgId: 1
    version: 1

  # Elasticsearch 数据源（用于日志查询）
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: logstash-*
    isDefault: false
    editable: true
    jsonData:
      esVersion: 8.0.0
      timeField: '@timestamp'
      logMessageField: message
      logLevelField: level
    orgId: 1
    version: 1

  # Jaeger 数据源（用于追踪查询）
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    isDefault: false
    editable: true
    orgId: 1
    version: 1

  # Loki 数据源（日志聚合，可选）
  # - name: Loki
  #   type: loki
  #   access: proxy
  #   url: http://loki:3100
